services:
  - type: web
    name: aura
    runtime: docker
    plan: starter
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: aura-media
      mountPath: /var/data/aura/uploads
      sizeGB: 1
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: aura
      - key: AURA_UPLOAD_DIR
        value: /var/data/aura/uploads
      - key: AURA_FREE_ACCESS_END
        value: "2026-12-01T16:36:13.739Z"
      - key: COOKIE_SECURE
        value: "true"
      - key: CORS_ORIGINS
        value: https://aura.onrender.com
      - key: FRONTEND_URL
        value: https://aura.onrender.com
      - key: BACKEND_PUBLIC_URL
        value: https://aura.onrender.com
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://aura.onrender.com/api/auth/google/callback
      - key: GOOGLE_FRONTEND_URL
        value: https://aura.onrender.com/auth
      - key: EMERGENT_LLM_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_PRICE_PRO
        sync: false
      - key: STRIPE_PRICE_CREATOR
        sync: false
      - key: ESEWA_PRODUCT_CODE
        sync: false
      - key: ESEWA_SECRET_KEY
        sync: false
      - key: ESEWA_ENV
        value: sandbox
      - key: KHALTI_SECRET_KEY
        sync: false
      - key: KHALTI_ENV
        value: sandbox
