services:
  - type: web
    name: aura
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: MONGO_URL
        sync: false
      - key: DB_NAME
        value: aura
      - key: AURA_FREE_ACCESS_END
        value: "2026-12-01T16:36:13.739Z"
      - key: COOKIE_SECURE
        value: "true"
